<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoonieRoo Settlement Sim</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f0e; color: #d8dcd6; font: 13px ui-monospace, Consolas, monospace; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .hud-bar { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; align-items: center; padding: 6px; background: rgba(20, 23, 21, 0.9); border: 1px solid #333a35; border-radius: 6px; pointer-events: auto; }
      .hud-button { white-space: nowrap; font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
      .hud-button:hover { background: #2c332e; }
      .hud-button.active { background: #3d5a46; border-color: #6c9a78; }
      .hud-sep { width: 1px; align-self: stretch; background: #3a423c; margin: 0 4px; }
      .hud-info { position: absolute; left: 12px; top: 58px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
      .hud-status { padding: 4px 8px; color: #9aa39b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 220px); box-sizing: border-box; background: rgba(20, 23, 21, 0.85); border-radius: 4px; }
      .hud-clock { padding: 0 6px; color: #f0d39a; white-space: nowrap; min-width: 128px; }
      .hud-clock.night { color: #9cb4ff; }
      .hud-control { padding: 4px 9px; color: #f0c850; background: rgba(20, 23, 21, 0.9); border: 1px solid #f0c850; border-radius: 4px; max-width: 620px; font-size: 12px; }
      .hud-story-line { color: #ddd; font-style: italic; max-width: 420px; }
      .hud-story-ask { color: #f0c850; max-width: 420px; }
      .menu { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 9, 0.72); backdrop-filter: blur(2px); }
      .menu[hidden] { display: none; }
      .menu-panel { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 22px 26px; background: rgba(20, 23, 21, 0.97); border: 1px solid #3f4a42; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
      .menu-title { font-size: 30px; letter-spacing: 6px; color: #e8d9a8; }
      .menu-subtitle { color: #7f8a80; margin-bottom: 10px; font-style: italic; }
      .menu-heading { color: #8cf0a4; font-size: 15px; margin-top: 4px; }
      .menu-button { font: inherit; font-size: 15px; color: inherit; text-align: left; background: #222824; border: 1px solid #3a423c; border-radius: 5px; padding: 9px 12px; cursor: pointer; }
      .menu-button:hover { background: #2c332e; }
      .menu-button.primary { background: #2f4a37; border-color: #6c9a78; color: #eafbe9; }
      .menu-button.primary:hover { background: #3a5c44; }
      .menu-small { font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      .menu-small:disabled { opacity: 0.4; cursor: default; }
      .menu-note { color: #8f998f; font-size: 12px; }
      .menu-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .menu-label { color: #b9c2b9; min-width: 72px; }
      .menu-presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
      .menu-preset { font: inherit; color: inherit; text-align: left; background: #1d221f; border: 1px solid #3a423c; border-radius: 6px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
      .menu-preset:hover { background: #262d28; }
      .menu-preset.chosen { border-color: #f0c850; background: #2a281c; }
      .menu-preset-title { color: #e8d9a8; font-size: 14px; }
      .menu-preset-about { color: #9aa39b; font-size: 12px; }
      .menu-preset:disabled { opacity: 0.4; cursor: default; }
      .menu-warn { color: #f08a6a; }
      .menu-button:disabled { opacity: 0.4; cursor: default; }
      .menu-custom summary { cursor: pointer; color: #b9c2b9; padding: 4px 0; }
      .menu-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; padding: 6px 0; }
      .menu-input { font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 3px 6px; }
      .hud-toast { padding: 5px 9px; color: #12160f; background: rgba(140, 240, 164, 0.95); border-radius: 4px; max-width: 520px; }
      .hud-wanderers { padding: 5px 8px; background: rgba(20, 23, 21, 0.9); border: 1px solid #c9b88a; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
      .hud-wanderers-title { color: #e8d9a8; }
      .hud-alerts { padding: 4px 8px; background: rgba(20, 23, 21, 0.85); border: 1px solid #5a4a3a; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; pointer-events: auto; max-width: 420px; }
      .hud-alert.clickable { cursor: pointer; }
      .hud-alert.clickable:hover { text-decoration: underline; }
      .hud-overview { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 6; max-width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 120px); overflow: auto; padding: 8px 12px; background: rgba(20, 23, 21, 0.97); border: 1px solid #6c9a78; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; font-size: 12px; color: #ddd; }
      .hud-overview-head { color: #e8d9a8; margin-top: 4px; }
      .hud-overview-text { color: #ccc; }
      .hud-overview-table { border-collapse: collapse; }
      .hud-overview-table th, .hud-overview-table td { padding: 1px 8px 1px 0; text-align: left; white-space: nowrap; }
      .hud-overview-table th { color: #9ab; font-weight: normal; }
      .hud-wanderer { display: flex; align-items: center; gap: 6px; }
      .hud-wanderer-label { color: #ddd; margin-right: 4px; }
      .hud-game { position: absolute; right: 12px; top: 58px; z-index: 5; padding: 8px 10px; background: rgba(20, 23, 21, 0.96); border: 1px solid #6c9a78; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; font-size: 12px; }
      .hud-game-title { color: #8cf0a4; }
      .hud-game-row { display: flex; align-items: center; gap: 6px; }
      .hud-game-label { flex: 1; color: #ddd; margin-right: 6px; }
      .hud-button:disabled { opacity: 0.4; cursor: default; }
      .hud-craft { padding: 5px 8px; background: rgba(20, 23, 21, 0.9); border: 1px solid #be9664; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
      .hud-craft-value { min-width: 18px; text-align: center; color: #e8d9a8; }
      .hud-select { font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 3px 4px; }
      .worldmap { position: absolute; inset: 0; z-index: 20; background: rgba(8, 9, 10, 0.97); display: flex; flex-direction: column; pointer-events: auto; }
      .worldmap[hidden] { display: none; }
      .worldmap-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #333a35; flex-wrap: wrap; }
      .worldmap-title { color: #e8d9a8; font-size: 15px; letter-spacing: 2px; }
      .worldmap-hint { color: #8f998f; font-size: 12px; flex: 1; }
      .worldmap-canvas { flex: 1; width: 100%; min-height: 0; cursor: crosshair; }
      .worldmap-note { position: absolute; width: 200px; }
      .hud-minimap { position: absolute; right: 12px; bottom: 12px; image-rendering: pixelated; border: 1px solid #333a35; border-radius: 4px; background: #0a0b0d; pointer-events: auto; cursor: crosshair; }
      .hud-feed { padding: 4px 8px; color: #ffb3a8; white-space: pre; background: rgba(20, 23, 21, 0.85); border-radius: 4px; font-size: 12px; }
      .hud-room { margin: 0; padding: 6px 10px; background: rgba(20, 23, 21, 0.92); border: 1px solid #333a35; border-radius: 6px; line-height: 1.4; }
      .hud-priorities { padding: 6px 8px; background: rgba(20, 23, 21, 0.92); border: 1px solid #333a35; border-radius: 6px; pointer-events: auto; }
      .prio-table { border-collapse: collapse; }
      .prio-table th { font-weight: normal; color: #9aa39b; padding: 2px 6px; text-align: center; }
      .prio-table th:first-child, .prio-name { text-align: left; }
      .prio-table td { padding: 2px 4px; text-align: center; }
      .prio-table tr.selected .prio-name { color: #8cf0a4; }
      .prio-name { cursor: pointer; padding-right: 10px; }
      .prio-mood { color: #c9cfc9; cursor: help; }
      .prio-mood.low { color: #ff8a7a; }
      .prio-mood.high { color: #8cf0a4; }
      .prio-doing { color: #9aa39b; text-align: left !important; min-width: 130px; padding-left: 10px; }
      .prio-cell { font: inherit; width: 28px; height: 22px; border-radius: 4px; border: 1px solid #3a423c; cursor: pointer; color: #111; }
      .prio-cell.p1 { background: #8cf0a4; }
      .prio-cell.p2 { background: #b9e08a; }
      .prio-cell.p3 { background: #e0cf8a; }
      .prio-cell.p4 { background: #e0a98a; }
      .prio-cell.p0 { background: #2a302c; color: #6c746d; }
      .hud-build { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; min-width: 460px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 6px 8px 5px; background: rgba(20, 23, 21, 0.94); border: 1px solid #333a35; border-radius: 8px; pointer-events: auto; }
      .build-tabs { display: flex; gap: 2px; border-bottom: 1px solid #333a35; margin-bottom: 6px; }
      .build-tab { font: inherit; color: #9aa39b; background: none; border: none; border-bottom: 2px solid transparent; padding: 4px 10px; cursor: pointer; }
      .build-tab:hover { color: #d8dcd6; }
      .build-tab.active { color: #d8dcd6; border-bottom-color: #8cf0a4; }
      .build-tools { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }
      .build-hint { margin-top: 5px; color: #7d867e; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-paused-banner.above-build { bottom: 140px; left: 50%; }
      .hud-paused-frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(255, 196, 92, 0.85), inset 0 0 60px rgba(255, 196, 92, 0.18); }
      /* Centred, but never far enough left to sit on the priority panel (bottom-left, ~380px wide; banner ~345px). */
      .hud-paused-banner { position: absolute; left: max(50%, 576px); bottom: 18px; white-space: nowrap; transform: translateX(-50%); padding: 6px 16px; color: #1a1408; background: rgba(255, 196, 92, 0.95); border-radius: 6px; font-weight: bold; letter-spacing: 0.08em; }
      .hud-bottom-left { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
      .hud-bottom-left > * { pointer-events: auto; }
      .hud-card { width: 340px; box-sizing: border-box; padding: 9px 11px 10px; background: rgba(20, 23, 21, 0.94); border: 1px solid #3a423c; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
      .hud-card-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .hud-card-name { color: #e8d9a8; font-size: 14px; white-space: nowrap; }
      .hud-card-about { color: #8f998f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-card-doing { color: #b9c2b9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-card-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
      .hud-card-bar-top { display: flex; justify-content: space-between; color: #9aa39b; margin-bottom: 2px; }
      .hud-card-track { height: 5px; background: #2c332e; border-radius: 3px; overflow: hidden; }
      .hud-card-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
      .hud-card-fill.health { background: #97c459; }
      .hud-card-fill.food { background: #c9a35a; }
      .hud-card-fill.water { background: #4f94d4; }
      .hud-card-fill.rest { background: #8a83d8; }
      .hud-card-fill.endurance { background: #5fb8a4; }
      .hud-card-fill.warmth { background: #d8774a; }
      .hud-card-fill.low { background: #ef9f27; }
      .hud-card-fill.crit { background: #e0483a; }
      .hud-card-minds { display: flex; flex-wrap: wrap; gap: 4px 10px; color: #9aa39b; border-top: 1px solid #2c332e; padding-top: 6px; }
      .hud-card-mind { cursor: help; }
      .hud-card-mind.bad { color: #ff8a7a; }
      .hud-conditions { position: absolute; right: 12px; top: 58px; z-index: 4; display: flex; flex-direction: column; align-items: stretch; gap: 5px; width: 160px; pointer-events: auto; }
      .hud-condition { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: help; border: 1px solid; }
      .hud-condition-glyph { width: 14px; text-align: center; font-size: 13px; }
      .hud-condition.bad { background: rgba(58, 29, 29, 0.94); border-color: #a32d2d; color: #f7c1c1; }
      .hud-condition.mild { background: rgba(58, 42, 18, 0.94); border-color: #854f0b; color: #fac775; }
      .hud-condition.good { background: rgba(20, 48, 31, 0.94); border-color: #0f6e56; color: #9fe1cb; }
      .hud-control.keys { color: #9aa39b; border-color: #3a423c; }
      .hud-bag, .hud-loot { position: absolute; right: 12px; width: 220px; box-sizing: border-box; padding: 8px 10px; background: rgba(20, 23, 21, 0.94); border: 1px solid #3a423c; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
      .hud-bag { bottom: 140px; max-height: 40vh; overflow: auto; }
      .hud-loot { bottom: 140px; right: 244px; border-color: #be9664; }
      .hud-bag-head { color: #e8d9a8; }
      .hud-bag-row { display: flex; align-items: center; gap: 6px; }
      .hud-bag-slot { width: 12px; color: #f0c850; }
      .hud-bag-name { flex: 1; color: #d8dcd6; }
      .hud-bag-kg { color: #8f998f; min-width: 26px; text-align: right; }
      .hud-bag-empty { color: #7f8a80; font-style: italic; }
      .hud-small { padding: 1px 6px; font-size: 11px; }
      [hidden] { display: none !important; }
      .survivor-mode .colony-only { display: none !important; }
      .hud-debug { position: absolute; right: 12px; top: 58px; max-height: calc(100vh - 80px); overflow: auto; margin: 0; padding: 8px 10px; background: rgba(20, 23, 21, 0.9); border: 1px solid #333a35; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
