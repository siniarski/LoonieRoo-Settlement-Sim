<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoonieRoo Settlement Sim</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f0e; color: #d8dcd6; font: 13px ui-monospace, Consolas, monospace; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .hud-bar { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; align-items: center; padding: 6px; background: rgba(20, 23, 21, 0.9); border: 1px solid #333a35; border-radius: 6px; pointer-events: auto; }
      .hud-button { white-space: nowrap; font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
      .hud-button:hover { background: #2c332e; }
      .hud-button.active { background: #3d5a46; border-color: #6c9a78; }
      .hud-sep { width: 1px; align-self: stretch; background: #3a423c; margin: 0 4px; }
      .hud-info { position: absolute; left: 12px; top: 58px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
      .hud-status { padding: 4px 8px; color: #9aa39b; white-space: pre; background: rgba(20, 23, 21, 0.85); border-radius: 4px; }
      .hud-clock { padding: 0 6px; color: #f0d39a; white-space: nowrap; min-width: 128px; }
      .hud-clock.night { color: #9cb4ff; }
      .hud-toast { padding: 5px 9px; color: #12160f; background: rgba(140, 240, 164, 0.95); border-radius: 4px; max-width: 520px; }
      .hud-wanderers { padding: 5px 8px; background: rgba(20, 23, 21, 0.9); border: 1px solid #c9b88a; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
      .hud-wanderers-title { color: #e8d9a8; }
      .hud-wanderer { display: flex; align-items: center; gap: 6px; }
      .hud-wanderer-label { color: #ddd; margin-right: 4px; }
      .hud-game { position: absolute; right: 12px; top: 58px; z-index: 5; padding: 8px 10px; background: rgba(20, 23, 21, 0.96); border: 1px solid #6c9a78; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; font-size: 12px; }
      .hud-game-title { color: #8cf0a4; }
      .hud-game-row { display: flex; align-items: center; gap: 6px; }
      .hud-game-label { flex: 1; color: #ddd; margin-right: 6px; }
      .hud-button:disabled { opacity: 0.4; cursor: default; }
      .hud-craft { padding: 5px 8px; background: rgba(20, 23, 21, 0.9); border: 1px solid #be9664; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
      .hud-craft-value { min-width: 18px; text-align: center; color: #e8d9a8; }
      .hud-select { font: inherit; color: inherit; background: #222824; border: 1px solid #3a423c; border-radius: 4px; padding: 3px 4px; }
      .hud-minimap { position: absolute; right: 12px; bottom: 12px; image-rendering: pixelated; border: 1px solid #333a35; border-radius: 4px; background: #0a0b0d; pointer-events: auto; cursor: crosshair; }
      .hud-feed { padding: 4px 8px; color: #ffb3a8; white-space: pre; background: rgba(20, 23, 21, 0.85); border-radius: 4px; font-size: 12px; }
      .hud-room { margin: 0; padding: 6px 10px; background: rgba(20, 23, 21, 0.92); border: 1px solid #333a35; border-radius: 6px; line-height: 1.4; }
      .hud-priorities { position: absolute; left: 12px; bottom: 12px; padding: 6px 8px; background: rgba(20, 23, 21, 0.92); border: 1px solid #333a35; border-radius: 6px; pointer-events: auto; }
      .prio-table { border-collapse: collapse; }
      .prio-table th { font-weight: normal; color: #9aa39b; padding: 2px 6px; text-align: center; }
      .prio-table th:first-child, .prio-name { text-align: left; }
      .prio-table td { padding: 2px 4px; text-align: center; }
      .prio-table tr.selected .prio-name { color: #8cf0a4; }
      .prio-name { cursor: pointer; padding-right: 10px; }
      .prio-mood { color: #c9cfc9; cursor: help; }
      .prio-mood.low { color: #ff8a7a; }
      .prio-mood.high { color: #8cf0a4; }
      .prio-doing { color: #9aa39b; text-align: left !important; min-width: 130px; padding-left: 10px; }
      .prio-cell { font: inherit; width: 28px; height: 22px; border-radius: 4px; border: 1px solid #3a423c; cursor: pointer; color: #111; }
      .prio-cell.p1 { background: #8cf0a4; }
      .prio-cell.p2 { background: #b9e08a; }
      .prio-cell.p3 { background: #e0cf8a; }
      .prio-cell.p4 { background: #e0a98a; }
      .prio-cell.p0 { background: #2a302c; color: #6c746d; }
      .hud-build { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; min-width: 460px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 6px 8px 5px; background: rgba(20, 23, 21, 0.94); border: 1px solid #333a35; border-radius: 8px; pointer-events: auto; }
      .build-tabs { display: flex; gap: 2px; border-bottom: 1px solid #333a35; margin-bottom: 6px; }
      .build-tab { font: inherit; color: #9aa39b; background: none; border: none; border-bottom: 2px solid transparent; padding: 4px 10px; cursor: pointer; }
      .build-tab:hover { color: #d8dcd6; }
      .build-tab.active { color: #d8dcd6; border-bottom-color: #8cf0a4; }
      .build-tools { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }
      .build-hint { margin-top: 5px; color: #7d867e; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-paused-banner.above-build { bottom: 140px; left: 50%; }
      .hud-paused-frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(255, 196, 92, 0.85), inset 0 0 60px rgba(255, 196, 92, 0.18); }
      /* Centred, but never far enough left to sit on the priority panel (bottom-left, ~380px wide; banner ~345px). */
      .hud-paused-banner { position: absolute; left: max(50%, 576px); bottom: 18px; white-space: nowrap; transform: translateX(-50%); padding: 6px 16px; color: #1a1408; background: rgba(255, 196, 92, 0.95); border-radius: 6px; font-weight: bold; letter-spacing: 0.08em; }
      [hidden] { display: none !important; }
      .hud-debug { position: absolute; right: 12px; top: 58px; max-height: calc(100vh - 80px); overflow: auto; margin: 0; padding: 8px 10px; background: rgba(20, 23, 21, 0.9); border: 1px solid #333a35; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
